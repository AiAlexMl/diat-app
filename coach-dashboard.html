<!DOCTYPE html>
<!-- דשבורד המאמנים החי (שלב 2). העיצוב ממוחזר 1:1 מ-coach-demo.html.
     ההבדלים: נתונים אמיתיים מ-coach_roster(), בלי טאב לוח (שלב 3),
     כפתור הסרה בכל כרטיס, ואזור לינק ההזמנה. -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ShapEat · הדשבורד שלי</title>
<link rel="icon" type="image/png" href="/brand/AVATAR-shapeat.png">
<link rel="stylesheet" href="brand/fonts/heebo.css">
<style>
  :root{
    --accent:#4f46e5; --accent2:#7c3aed;
    --text:#1e2235; --text-sec:#5b6072; --text-tert:#5f6675;
    --border:#e6e8f0; --card:#fff;
    --ok:#10b981; --warn:#f59e0b; --bad:#dc2626;
    --radius:16px; --shadow:0 4px 18px rgba(40,46,90,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Heebo','Segoe UI',system-ui,sans-serif;
    background:linear-gradient(135deg,#f0f2f8,#e8ecf7) fixed;
    color:var(--text); min-height:100vh; padding:20px 14px 40px;
  }
  .wrap{max-width:760px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .logo{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:800;letter-spacing:-.5px;
    direction:ltr;color:var(--text);text-decoration:none}
  .logo img{width:30px;height:30px;border-radius:8px;object-fit:cover}
  .logo .eat{color:var(--accent)}
  .signout{font-size:12px;font-weight:600;color:var(--text-tert);background:none;border:none;
    cursor:pointer;font-family:inherit;text-decoration:underline}

  .coach-bar{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
  .coach-av{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:0 0 auto}
  .coach-name{font-weight:800;font-size:18px}
  .coach-sub{font-size:13px;opacity:.9}
  .coach-stats{margin-right:auto;display:flex;gap:18px;text-align:center}
  .coach-stats .n{font-weight:800;font-size:20px;line-height:1}
  .coach-stats .l{font-size:11px;opacity:.9;margin-top:3px}

  /* לינק ההזמנה */
  .invite{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px 16px;margin-bottom:16px}
  .invite summary{display:flex;align-items:center;justify-content:space-between;
    font-size:14px;font-weight:700;cursor:pointer;list-style:none;min-height:24px}
  .invite summary::-webkit-details-marker{display:none}
  .inv-chev{color:var(--text-tert);font-size:12px;transition:transform .15s}
  .invite[open] .inv-chev{transform:rotate(180deg)}
  .invite p{font-size:12px;color:var(--text-tert);line-height:1.6;margin:8px 0 9px}
  .invite-row{display:flex;gap:8px;flex-wrap:wrap}
  .invite-url{flex:1;min-width:180px;font-size:12px;direction:ltr;text-align:left;
    border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:#fafbff;
    font-family:inherit;color:var(--text-sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ibtn{border:none;border-radius:10px;padding:9px 14px;font-family:inherit;font-size:13px;
    font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
  .ibtn.ghost{background:#f3f4f8;color:var(--text-sec)}

  /* רשימת טריאז': שורה קומפקטית לכל מתאמנת, פירוט נפתח בלחיצה */
  .roster{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .row + .row{border-top:1px solid var(--border)}
  .row-head{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer}
  .row-head:hover{background:#fafbff}
  .row.flagged .row-head{background:#fffbfb}
  .row-name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:8.5em}
  .row.flagged .row-name{color:var(--bad)}
  .row-status{margin-inline-start:auto;font-size:12px;color:var(--text-tert);white-space:nowrap}
  .row.flagged .row-status{color:var(--bad);font-weight:600}
  .chev{font-size:11px;color:var(--text-tert);transition:transform .15s}
  .row.open .chev{transform:rotate(180deg)}
  .row-detail{display:none;padding:0 14px 13px 14px}
  .row.open .row-detail{display:block}

  /* הרצועה: יום = נקודה. שלושה מצבים, כי "לפני שהצטרפה" אינו "לא סימנה" */
  .strip{display:inline-flex;gap:2.5px;flex:0 0 auto}
  .strip .d{width:7px;height:7px;border-radius:50%;display:inline-block}
  .strip .on{background:var(--ok)}
  .strip .off{background:#e2e5ee}
  .strip .pre{background:transparent;box-shadow:inset 0 0 0 1px #eceef5}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
  .trainee{display:flex;align-items:center;gap:13px}
  .av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;color:#fff;flex:0 0 auto}
  .t-main{flex:1;min-width:0}
  .t-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .goal{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#eef0fb;color:var(--accent)}
  .flag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fef2f2;color:var(--bad)}
  .t-metrics{display:flex;align-items:center;gap:16px;margin-top:8px;flex-wrap:wrap}
  .metric{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-sec)}
  .metric b{color:var(--text);font-weight:700}
  .streak{color:var(--warn);font-weight:700}
  .trend{font-weight:700}
  .trend.dn{color:var(--ok)} .trend.up{color:var(--bad)} .trend.fl{color:var(--text-tert)}
  .rm{border:none;background:#f6f7fb;border-radius:9px;color:var(--text-tert);font-family:inherit;
    font-size:12px;font-weight:600;cursor:pointer;padding:6px 12px;margin-top:10px}
  .rm:hover{background:#fef2f2;color:var(--bad)}

  .empty{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:30px 22px;text-align:center;color:var(--text-sec);font-size:14px;line-height:1.8}
  .foot{text-align:center;font-size:11px;color:var(--text-tert);margin-top:22px;line-height:1.6}

  /* ── טלפון ──
     בעיצוב הרחב הכל יושב בשורה אחת, ובמסך צר זה נשבר: הכותרת התפצלה לשלוש
     שורות, "רענון" ברח לשורה משלו, ושם המתאמנת נחתך ל"מ..". כאן מסדרים
     מחדש לפי אנכי במקום לדחוס. */
  @media (max-width: 560px) {
    body{padding:14px 10px 30px}
    .coach-bar{flex-wrap:wrap;gap:11px;padding:14px}
    .coach-av{width:44px;height:44px;font-size:17px}
    .coach-name{font-size:16px}
    .coach-stats{margin-right:0;width:100%;justify-content:space-between;gap:0;
      border-top:1px solid rgba(255,255,255,.22);padding-top:11px}
    .coach-stats .n{font-size:18px}
    .coach-stats .l{font-size:10px}

    .invite-url{min-width:0;width:100%;flex:1 1 100%;order:-1}
    .invite-row .ibtn{flex:1}

    /* השם מקבל את כל השורה, והרצועה יורדת מתחתיו במקום להידחס לצדו */
    .row-head{flex-wrap:wrap;gap:8px;padding:12px 13px}
    .row-name{max-width:none;flex:1;font-size:15px}
    .row-status{margin-inline-start:0;font-size:11.5px}
    /* padding ולא margin: הרצועה נמתחת ל-100% מרוחב השורה, ו-margin היה נוסף
       על הרוחב הזה ודוחף אותה אל מחוץ למסך. padding נספר בתוכו (box-sizing:border-box). */
    .strip{order:3;flex-basis:100%;padding-inline-start:53px;gap:3px}
    .strip .d{width:8px;height:8px}
    .chev{margin-inline-start:auto}
    .t-metrics{gap:10px;font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <!-- הלוגו הוא הדרך חזרה לאתר. בלעדיו הדשבורד הוא מבוי סתום. -->
    <a class="logo" href="/" title="חזרה ל-ShapEat"><img src="brand/AVATAR-shapeat.png" alt="ShapEat"><span>Shap<span class="eat">Eat</span></span></a>
    <button class="signout" id="signout" hidden>התנתקות</button>
  </div>

  <div id="root">
    <div class="empty">טוען…</div>
  </div>

  <div class="foot">
    ShapEat · התזונה מחושבת אוטומטית באפליקציה.<br>
    המאמן/ת רואה התמדה ומגמה בלבד, לא תפריט, לא קלוריות ולא משקל בק"ג.
  </div>
</div>

<!-- גרסה + SRI זהים לאלה שב-index.html. אם מעדכנים שם — לעדכן גם כאן, בהתאמה מודעת. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.min.js"
        integrity="sha384-DjOvX/sJLsmbMrw4wTvf6l3kiGBjdxyOO6X2MTFwOOXGkjN/mE08BoDzrpaaIjil"
        crossorigin="anonymous"></script>
<script>
(function () {
  'use strict';
  var SUPA_URL  = 'https://kjlxgamalfzdjtjxfzun.supabase.co';
  var SUPA_ANON = 'sb_publishable_cUbB5SU30DWzSdFmP2T24w_lc4PjF9f';
  if (!window.supabase) { document.getElementById('root').innerHTML =
    '<div class="empty">טעינת הספרייה נכשלה. רעננו את העמוד.</div>'; return; }
  var sb = window.supabase.createClient(SUPA_URL, SUPA_ANON);
  var root = document.getElementById('root');

  // ── esc: כל שדה שמגיע מה-DB עובר כאן (מועתק מ-ui.js) ──
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  };

  var AV = ['#4f46e5','#7c3aed','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899','#14b8a6'];
  var avColor = function (i) { return AV[i % AV.length]; };
  var initial = function (n) { return (String(n).trim()[0] || '?'); };
  var GOALS = { cut: 'חיטוב', maintain: 'שמירה', bulk: 'מסה' };

  // גרף מגמת המשקל. shape כבר מגיע מהשרת מנורמל 0-1 — אין כאן ק"ג בשום שלב.
  function sparkline(shape) {
    var w = 64, h = 22;
    if (!shape || shape.length < 2) return '';
    var xs = function (i) { return i * (w / (shape.length - 1)); };
    var ys = function (v) { return h - 2 - v * (h - 4); };
    var d = shape.map(function (v, i) {
      return (i ? 'L' : 'M') + xs(i).toFixed(1) + ',' + ys(Number(v)).toFixed(1);
    }).join(' ');
    var up = Number(shape[shape.length - 1]) > Number(shape[0]);
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
      '<path d="' + d + '" fill="none" stroke="' + (up ? '#dc2626' : '#10b981') +
      '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }
  function trendLabel(delta) {
    var d = Number(delta);
    if (!isFinite(d) || Math.abs(d) < 0.3) return '<span class="trend fl">→ יציב</span>';
    return '<span class="trend ' + (d < 0 ? 'dn' : 'up') + '">' +
      (d < 0 ? '▼' : '▲') + ' ' + Math.abs(d).toFixed(1) + ' ק"ג</span>';
  }

  var me = null;

  // ── מיתוג המאמנת ──
  // brand_color נשמר בטבלה ולא היה בשימוש, ולכן הדשבורד נראה כמו ברירת מחדל
  // בזמן שהדמו נראה ממותג. הצבע מאומת ב-DB ב-regex, ואנחנו מאמתים שוב לפני
  // הזרקה ל-CSS (צבע חופשי = וקטור CSS injection), ובנוסף בודקים ניגודיות:
  // צבע בהיר עם טקסט לבן אינו קריא, ואז נופלים לברירת המחדל.
  function applyBrand(hex) {
    if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return;
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    var lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
    if (lum > 0.62) return;                       // בהיר מדי לטקסט לבן — נשארים בברירת המחדל
    var dark = '#' + [r, g, b].map(function (c) {
      return Math.round(c * 0.72).toString(16).padStart(2, '0');
    }).join('');
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent2', dark);
  }

  // ?coach= לצד ?join= — coach-theme.js קורא רק את הראשון, ובלעדיו הפתיחה
  // הראשונה של המתאמן/ת מגיעה בלי שום מיתוג של המאמן/ת. זה בדיוק הרגע שבו
  // המיתוג הכי חשוב. (דווח 09/08/2026)
  function inviteUrl() {
    return location.origin + '/?coach=' + encodeURIComponent(me.slug) + '&join=' + me.invite_code;
  }

  // רצועת 14 יום. שלושה מצבים, כי "לפני שהצטרפה" אינו "לא סימנה":
  // null = עוד לא הייתה איתנו · 0 = לא סימנה · N = סימנה N ארוחות
  function strip(days) {
    if (!days || !days.length) return '';
    return '<span class="strip">' + days.map(function (v) {
      if (v == null) return '<i class="d pre" title="לפני ההצטרפות"></i>';
      return v > 0 ? '<i class="d on" title="' + esc(v) + ' ארוחות"></i>' : '<i class="d off" title="אין סימון"></i>';
    }).join('') + '</span>';
  }

  // "1 ימים" זו עברית שבורה. יחיד/זוגי/רבים בכל מקום שמציג ספירת ימים.
  var days1 = function (n) { return n === 1 ? 'יום אחד' : n === 2 ? 'יומיים' : n + ' ימים'; };

  // "פעילה X מתוך Y ימים" עובד רק כש-Y הוא מספר. ליום בודד צריך ניסוח אחר לגמרי.
  function activeText(active, window_) {
    if (!window_) return 'הצטרפות היום';
    if (window_ === 1) return active ? 'סומן ביום הראשון' : 'יום ראשון, ללא סימון';
    return 'סומנו <b>' + active + '</b> ימים מתוך ' + window_;
  }

  // מצב במילים, בלי אחוז ובלי ציון. עובדה שהמאמן/ת מפרש/ת בעצמו/ה.
  // לשון סבילה בכוונה: הסטטוס מתאר את הסימון ולא את האדם, ולכן אין בו מגדר.
  function statusText(r) {
    if (r.window_days <= 1 && !r.active_days) return 'הצטרפות היום';
    if (r.days_silent >= 999) return 'ללא סימון עדיין';
    if (r.days_silent === 0) return 'סומן היום';
    if (r.days_silent === 1) return 'סומן אתמול';
    return 'ללא סימון ' + days1(r.days_silent);
  }

  function renderShell(rows) {
    var flags = rows.filter(function (r) { return r.needs_attention; }).length;
    var active = rows.filter(function (r) { return r.days_silent <= 1; }).length;

    var html =
      '<div class="coach-bar">' +
        '<div class="coach-av">' + esc(initial(me.display_name)) + '</div>' +
        '<div><div class="coach-name">' + esc(me.display_name) + '</div>' +
        '<div class="coach-sub">' + esc(me.tagline || 'ShapEat') + '</div></div>' +
        '<div class="coach-stats">' +
          '<div><div class="n">' + rows.length + '</div><div class="l">מתאמנים</div></div>' +
          '<div><div class="n">' + active + '</div><div class="l">פעילות היום</div></div>' +
          '<div><div class="n">' + flags + '</div><div class="l">צריכים תשומת לב</div></div>' +
        '</div>' +
      '</div>' +

      // הלינק הוא פעולת התקנה שנעשית פעם אחת, לא התוכן היומיומי. כשאין עדיין
      // מתאמנות הוא הדבר היחיד שיש לעשות ולכן פתוח; ברגע שיש רשימה הוא מתקפל
      // לשורה אחת, כדי שהמתאמנות יתפסו את המסך ולא תיבת ההעתקה.
      '<details class="invite"' + (rows.length ? '' : ' open') + '>' +
        '<summary><span>לינק ההזמנה שלך</span><span class="inv-chev">▾</span></summary>' +
        '<p>שלחו אותו למתאמן/ת. הם יראו מסך הסכמה עם השם שלך, ויחליטו בעצמם מה לשתף.<br>' +
        'אם הלינק הגיע לידיים לא נכונות, רעננו אותו והישן יפסיק לעבוד מיד.</p>' +
        '<div class="invite-row">' +
          '<div class="invite-url" id="iurl">' + esc(inviteUrl()) + '</div>' +
          '<button class="ibtn" id="icopy">העתקה</button>' +
          '<button class="ibtn ghost" id="irot">רענון</button>' +
        '</div>' +
      '</details>';

    if (!rows.length) {
      html += '<div class="empty">עדיין אין מתאמנים מחוברים.<br>' +
        'שלחו את הלינק שלמעלה, ומי שיאשר יופיע כאן.</div>';
    } else {
      // שורה קומפקטית = טריאז' ("מי צריכה אותי"). הפירוט נפתח בלחיצה, רק למי
      // שעומדים לכתוב לה. מאמנת עם 20 מתאמנות סורקת, היא לא קוראת 20 כרטיסים.
      html += '<div class="roster">' + rows.map(function (r, i) {
        var wm = (r.weight_delta != null && r.weight_shape)
          ? '<span class="metric">משקל ' + sparkline(r.weight_shape) + ' ' + trendLabel(r.weight_delta) + '</span>'
          : '';
        var ratio = (r.last_eaten != null)
          ? '<span class="metric">בפעם האחרונה <b>' + esc(r.last_eaten) + ' מתוך ' + esc(r.last_planned) + '</b> ארוחות</span>'
          : '';
        return '<div class="row' + (r.needs_attention ? ' flagged' : '') + '" data-i="' + i + '">' +
          '<div class="row-head" role="button" tabindex="0">' +
            '<div class="av" style="background:' + avColor(i) + '">' + esc(initial(r.display_name)) + '</div>' +
            '<span class="row-name">' + (r.needs_attention ? '⚠ ' : '') + esc(r.display_name) + '</span>' +
            strip(r.days) +
            '<span class="row-status">' + esc(statusText(r)) + '</span>' +
            '<span class="chev">▾</span>' +
          '</div>' +
          '<div class="row-detail">' +
            '<div class="t-metrics">' +
              (r.goal ? '<span class="goal">' + esc(GOALS[r.goal] || r.goal) + '</span>' : '') +
              '<span class="metric">' + activeText(r.active_days || 0, r.window_days || 0) + '</span>' +
              ratio + wm +
              (r.streak ? '<span class="metric streak">🔥 רצף ' + days1(r.streak) + '</span>' : '') +
            '</div>' +
            '<button class="rm" data-id="' + esc(r.trainee_id) + '" data-name="' + esc(r.display_name) +
              '">הסרה מהרשימה</button>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
    }

    root.innerHTML = html;
    document.getElementById('signout').hidden = false;

    document.getElementById('icopy').onclick = function () {
      navigator.clipboard.writeText(inviteUrl()).then(function () {
        document.getElementById('icopy').textContent = 'הועתק ✓';
      }, function () {});
    };
    document.getElementById('irot').onclick = async function () {
      if (!confirm('לרענן את הלינק? הישן יפסיק לעבוד מיד. מי שכבר מחובר/ת לא מושפע/ת.')) return;
      var r = await sb.rpc('rotate_invite');
      if (!r.error) { me.invite_code = r.data; load(); }
    };
    Array.prototype.forEach.call(root.querySelectorAll('.row-head'), function (h) {
      var open = function () { h.parentElement.classList.toggle('open'); };
      h.onclick = open;
      h.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
    });
    Array.prototype.forEach.call(root.querySelectorAll('.rm'), function (b) {
      b.onclick = async function (e) {
        e.stopPropagation();
        if (!confirm('להסיר את ' + b.dataset.name + '? השם יפסיק להופיע כאן, ולא תראו יותר את ההתמדה.')) return;
        await sb.from('coach_links').update({ status: 'revoked' })
          .eq('trainee_id', b.dataset.id).eq('status', 'active');
        load();
      };
    });
  }

  // ── התחברות: בדיוק אותן שתי שיטות כמו באפליקציה (Google + קוד למייל).
  //    זו אותה מערכת auth ואותה טבלת auth.users — מה שהופך משתמש למאמן/ת הוא
  //    שורת coaches שמצביעה עליו, לא סוג התחברות נפרד. ──
  function renderLogin(msg) {
    root.innerHTML =
      '<div class="empty">' +
        '<div style="font-weight:700;color:var(--text);margin-bottom:6px">הדשבורד שלך</div>' +
        (msg ? '<div style="margin-bottom:10px">' + esc(msg) + '</div>' : '') +
        // גוגל מאחורי קישור, כמו באפליקציה: בורר החשבונות של גוגל מציג את כתובת
        // סופהבייס, וזה נקרא כניסיון התחזות. הקוד למייל נשאר כולו אצלנו.
        '<div class="invite-row" style="justify-content:center">' +
          '<input class="invite-url" id="mail" type="email" placeholder="כתובת אימייל" ' +
            'style="direction:ltr;text-align:left;max-width:230px">' +
          '<button class="ibtn" id="send">שלחו קוד</button>' +
        '</div>' +
        '<div class="invite-row" id="codewrap" style="display:none;justify-content:center;margin-top:10px">' +
          '<input class="invite-url" id="code" inputmode="numeric" maxlength="6" placeholder="הקוד מהמייל" ' +
            'style="direction:ltr;text-align:center;max-width:130px;letter-spacing:4px">' +
          '<button class="ibtn" id="verify">אישור</button>' +
        '</div>' +
        '<div id="lstat" style="font-size:12px;margin-top:10px;min-height:16px"></div>' +
        '<button class="ibtn ghost" id="gshow" style="margin-top:12px;font-size:12px">התחברת בעבר עם Google?</button>' +
        '<div id="gwrap" style="display:none;margin-top:10px">' +
          '<button class="ibtn" id="gin">התחברות עם Google</button>' +
        '</div>' +
      '</div>';

    var stat = document.getElementById('lstat');
    var mail = document.getElementById('mail');

    document.getElementById('gshow').onclick = function () {
      document.getElementById('gwrap').style.display = '';
      this.style.display = 'none';
    };
    document.getElementById('gin').onclick = function () {
      sb.auth.signInWithOAuth({ provider: 'google',
        options: { redirectTo: location.origin + location.pathname + location.search } });
    };
    document.getElementById('send').onclick = async function () {
      var v = (mail.value || '').trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { stat.textContent = 'כתובת לא תקינה'; return; }
      stat.textContent = 'שולח…';
      var r = await sb.auth.signInWithOtp({ email: v });
      if (r.error) { stat.textContent = 'השליחה נכשלה, נסו שוב'; return; }
      document.getElementById('codewrap').style.display = '';
      stat.textContent = 'הקוד נשלח ל-' + v;
      document.getElementById('code').focus();
    };
    document.getElementById('verify').onclick = async function () {
      var c = (document.getElementById('code').value || '').replace(/\D/g, '');
      if (c.length !== 6) { stat.textContent = 'הקוד הוא 6 ספרות'; return; }
      stat.textContent = 'מאמת…';
      // שני סוגי טוקן: משתמש חדש = אישור הרשמה (signup), קיים = התחברות (email).
      var em = (mail.value || '').trim();
      var r = await sb.auth.verifyOtp({ email: em, token: c, type: 'email' });
      if (r.error) r = await sb.auth.verifyOtp({ email: em, token: c, type: 'signup' });
      if (r.error) { stat.textContent = 'קוד שגוי או שפג תוקפו'; return; }
      start();   // מחובר — מתחילים מחדש, כולל claim אם יש ?invite
    };
  }

  async function load() {
    var r = await sb.rpc('coach_roster');
    if (r.error) { root.innerHTML = '<div class="empty">טעינת הנתונים נכשלה.<br>' + esc(r.error.message) + '</div>'; return; }
    renderShell(r.data || []);
  }

  async function start() {
    var s = (await sb.auth.getSession()).data.session;

    // ?invite=<code> — תביעת חשבון חד-פעמית מהלינק שאלכס שלח
    var inv = new URLSearchParams(location.search).get('invite');
    if (s && inv && /^[0-9a-f-]{36}$/i.test(inv)) {
      await sb.rpc('claim_coach', { invite: inv });
      history.replaceState(null, '', location.pathname);
    }

    if (!s) { renderLogin(); return; }

    var c = await sb.from('coaches').select('display_name,tagline,invite_code,slug,brand_color').maybeSingle();
    if (c.error || !c.data) {
      root.innerHTML = '<div class="empty">החשבון הזה אינו מחובר לפרופיל מאמן/ת.<br>' +
        'אם קיבלתם לינק הזמנה, פתחו אותו שוב.</div>';
      document.getElementById('signout').hidden = false;
      return;
    }
    me = c.data;
    applyBrand(me.brand_color);
    load();
  }

  document.getElementById('signout').onclick = function () {
    sb.auth.signOut().then(function () { location.reload(); });
  };
  start();
})();
</script>
