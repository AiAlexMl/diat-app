# פינג ל-Supabase — ה-free tier מושהה אחרי שבוע ללא "פעילות מספקת".
# הערכים כאן ציבוריים בכוונה: אותו URL + anon key שכבר גלויים ב-supabase-client.js
# (ההגנה היא RLS, לא סודיות המפתח). לכן אין secrets — ה-workflow עצמאי ורץ מיד.
# המפתח הסודי (service_role) לעולם לא כאן.
#
# ✅ אומת 29/08/2026: **חודש בלי אף אזהרה**, כולל 16 יום כמעט ריקים לגמרי
#    (אלכס בחו"ל, 5 אירועים בסה"כ) — התקופה הכי שקטה שהייתה, ובדיוק התנאי שהפיל
#    את ההגדרה הקודמת. ⇒ ההשערה מ-29/07 אוששה: **נמדד נפח, לא עצם קיום הפינג.**
#    כלל ההסלמה למטה נשאר כתוב, אבל לא נדרש. לא לגעת בתדירות בלי סיבה חדשה.
#
# ═══ למה 3 הרצות × 4 שאילתות (הכרעה 29/07/2026) ═══
# ב-21/07 עברנו מפעמיים-בשבוע ליומי, וב-29/07 הגיעה אזהרה שלישית למרות שכל
# ההרצות הצליחו (HTTP 200). התיעוד של Supabase מנסח את הסף כ"כמה בקשות ביום",
# ברבים — כלומר נמדד נפח, לא עצם קיום הפינג. אצלנו הייתה בקשה אחת ביום.
# בנוסף: GitHub מעכב הרצות מתוזמנות ב-2-4 שעות באופן שגרתי ולפעמים מדלג,
# אז הרצה יומית בודדת היא נקודת כשל יחידה. 3 הרצות מפוזרות פותרות גם את זה.
# העלות: ~30 שניות ריצה בחודש, 360 בקשות בחודש (התקרה היא 50,000 MAU).
#
# ⚖️ מה שלא עושים, ולמה:
#   • בלי ג'יטר/רנדומיזציה של שעות. ה-keepalive הוא health check לגיטימי, לא
#     הסוואה. תזמון אקראי לא באמת מסווה (טווחי IP של Actions, User-Agent של curl,
#     אותה שאילתה בדיוק), אבל כן משנה את הכוונה מתום-לב להתחמקות. הסיכון האמיתי
#     הוא חשבון חסום עם דאטה של משתמשים בפנים — לא שווה כדי לחסוך לחיצת Restore.
#   • בלי כתיבה ובלי נתונים פיקטיביים. אלה SELECT בלבד: אפס שורות חדשות, אפס
#     מספר שקרי. בפרט לא נוגעים ב-events (יש לו insert policy ל-anon) — זו בדיוק
#     האנליטיקס שאמורה למכור לחברות מזון בשלב 4, ואסור לזהם אותה.
#
# ═══ כלל הסלמה (מוסכם 29/07/2026 — לא להתחיל את הדיון מאפס) ═══
#   1. אזהרה נוספת למרות זה  → פנייה לתמיכה של Supabase. חינם, ומחליפה ניחוש-סף
#                              בעובדה. לא מגדילים נפח עוד בלי לדעת מה הסף.
#   2. תמיכה: "קריאות לא נספרות" → טבלת keepalive ייעודית עם upsert של שורה אחת.
#                              טבלה מבודדת, לא נוגעת בשום טבלה עסקית.
#   3. Pro ($25/חודש)        → רק עם לקוח משלם ראשון. לא בגלל מיילים, ולא בגלל
#                              פיילוט חינמי (פיילוט פעיל מייצר תעבורה אמיתית ממילא).
#   4. גיבויים               → לא כרגע, וגם לא pg_dump: הענן הוא מראה ולא מקור
#                              (supabase-client.js:35 — "מקור התצוגה תמיד מקומי"),
#                              ו-pg_dump מעתיק מידע בריאותי למקום חדש שלא מוצהר
#                              ב-privacy.html. נפתח מחדש רק אם הענן יהפוך למקור האמת.
#   5. הפרויקט הושעה בפועל   → פשוט לשחזר. פרויקט מושהה ניתן לשחזור בלחיצה במשך
#                              90 יום והנתונים שלמים. המייל הוא ההתראה שמונעת את
#                              התרחיש היחיד שמסוכן: התעלמות של 3 חודשים ברצף.
#
# 💡 הפעילות הכי איכותית היא לא כאן: שקילה באפליקציה **כשאתה מחובר לחשבון**
#    מייצרת upsert מאומת ל-weight_logs (supabase-client.js:126). בקשה עם JWT של
#    משתמש אמיתי + כתיבה לטבלה עסקית = בדיוק מה ש-Supabase קוראים לו
#    "user database activity". זה בונוס מעל הרצפה האוטומטית שכאן, לא תחליף לה.
name: supabase-keepalive
on:
  schedule:
    - cron: '17 6 * * *'    # 06:17 UTC
    - cron: '17 14 * * *'   # 14:17 UTC
    - cron: '17 22 * * *'   # 22:17 UTC

  workflow_dispatch:

env:
  SUPABASE_URL: https://kjlxgamalfzdjtjxfzun.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_cUbB5SU30DWzSdFmP2T24w_lc4PjF9f

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          fail=0
          # ארבע הטבלאות עם RLS "עצמי בלבד": ל-anon הן מחזירות 200 + מערך ריק,
          # אבל השאילתה עצמה כן מגיעה לפוסטגרס (ה-RLS מסנן בתוך ה-DB, לא לפניו).
          # אומת ידנית ב-29/07/2026: כל הארבע → 200.
          for t in profiles favorites weight_logs day_logs; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/$t?select=*&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "$t -> HTTP $code"
            [ "$code" = "200" ] || fail=1
            sleep 2   # בקשות נפרדות, לא ברסט אחד
          done

          # ═══ שמירה על events (נוסף 13/08/2026 אחרי סקירת אבטחה) ═══
          # ל-events יש insert policy ל-anon (`with check (true)`), ולכן כל אחד עם
          # המפתח הציבורי יכול למלא אותה ולהשבית כתיבות של משתמשים אמיתיים.
          # מיגרציה 010 חוסמת ב-200,000 שורות; כאן מתריעים **הרבה לפני**.
          # events_health מחזירה מספרים בלבד ולכן נגישה עם המפתח הציבורי — אין כאן סוד.
          # כשל של ה-Action הוא ערוץ ההתרעה: גיטהאב שולח מייל אוטומטית.
          h=$(curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/events_health" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "events_health -> $h"
          total=$(echo "$h" | grep -o '"total":[0-9]*' | head -1 | cut -d: -f2)
          hour=$(echo "$h"  | grep -o '"last_hour":[0-9]*' | head -1 | cut -d: -f2)
          # ⚠️ fail-closed. אם הפונקציה נעלמה או החזירה שגיאה, `total` ריק — ובגרסה
          # הראשונה שני התנאים פשוט דילגו וההרצה עברה בירוק. שומר שנכשל **פתוח**
          # גרוע משומר שלא קיים, כי הוא נותן ביטחון שאין לו כיסוי. (נתפס בלוג 13/08)
          if ! echo "$total" | grep -qE '^[0-9]+$'; then
            echo "::error::events_health לא החזירה מספר — ההגנה על events אינה פעילה"; exit 1
          fi
          # ספים: ~290 שורות אחרי חודשיים אמיתיים, ו-5 ביום. 20,000 הוא פי 70
          # מהמצב הנוכחי ופי 10 מתחת לתקרה; 500 בשעה אינו מצב טבעי בשום תרחיש.
          if [ "$total" -gt 20000 ]; then
            echo "::error::events מכילה $total שורות — בדוק הצפה (התקרה 200,000)"; fail=1
          fi
          if echo "$hour" | grep -qE '^[0-9]+$' && [ "$hour" -gt 500 ]; then
            echo "::error::events קיבלה $hour שורות בשעה האחרונה — קצב לא טבעי"; fail=1
          fi
          exit $fail
